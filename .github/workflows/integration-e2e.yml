name: HTTPS integration E2E

on:
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/integration-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VITE_API_BASE_URL: /api/v1
      E2E_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Frontend validation and production bundle
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          npm run --prefix frontend typecheck
          npm run --prefix frontend lint
          npm test --prefix frontend
          npm run --prefix frontend build
          npm run --prefix e2e typecheck
          npm run --prefix e2e lint
          npm run --prefix e2e test:infra
          for script in e2e/scripts/*.sh; do bash -n "$script"; done
      - name: Backend and mandatory PostgreSQL tests
        run: |
          docker info > /dev/null
          ./backend/mvnw -f backend/pom.xml -B clean verify
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for suite, required in [('AuthenticationIntegrationTest',22), ('RegistrationConstraintsMigrationTest',3), ('CatalogIntegrationTest',6), ('CommerceIntegrationTest',10), ('AdminIntegrationTest',11)]:
              paths=list(Path('backend/target/surefire-reports').glob('TEST-*.'+suite+'.xml'))
              if len(paths)!=1: raise SystemExit('Missing required PostgreSQL test suite')
              root=ET.parse(paths[0]).getroot()
              if int(root.get('tests','0'))<required or any(int(root.get(k,'0')) for k in ['skipped','failures','errors']):
                  raise SystemExit('PostgreSQL tests must execute without skips/failures')
          print('Mandatory PostgreSQL suites executed successfully')
          PY
      - name: Real HTTPS Chromium integration
        run: bash e2e/scripts/run.sh "$E2E_ID"
      - name: Always clean only this run
        if: always()
        run: bash e2e/scripts/cleanup.sh "$E2E_ID"
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-integration-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            e2e/.state/${{ env.E2E_ID }}/evidence/setup.json
            e2e/.state/${{ env.E2E_ID }}/evidence/tls-reject.json
            e2e/.state/${{ env.E2E_ID }}/evidence/tls-accept.json
            e2e/.state/${{ env.E2E_ID }}/evidence/summary.json
            e2e/.state/${{ env.E2E_ID }}/evidence/correlation.json
            e2e/.state/${{ env.E2E_ID }}/evidence/cleanup.json
            e2e/.state/${{ env.E2E_ID }}/evidence/images.txt
            e2e/.state/${{ env.E2E_ID }}/evidence/browser-version.txt
