name: Frontend CI

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - 'vercel.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean dependency installation
        run: npm ci
      - name: TypeScript checks
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
