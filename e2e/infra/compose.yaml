services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cf_s1c
      POSTGRES_USER: cf_s1c
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generated by start.sh}
    tmpfs: [/var/lib/postgresql/data]
    networks: [database, fixtures]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cf_s1c -d cf_s1c']
      interval: 2s
      timeout: 3s
      retries: 45
  backend:
    image: eclipse-temurin:21-jre
    command: [java, -jar, /app/backend.jar]
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      POSTGRES_DB: cf_s1c
      POSTGRES_USER: cf_s1c
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      SESSION_COOKIE_SECURE: 'true'
    volumes:
      - ${REPO_DIR:?}/backend/target/backend-0.0.1-SNAPSHOT.jar:/app/backend.jar:ro
    networks: [upstream, database]
    depends_on:
      postgres: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export NO_PROXY="$${NO_PROXY:-},backend,localhost,127.0.0.1"
        export no_proxy="$${no_proxy:-},backend,localhost,127.0.0.1"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ${REPO_DIR}/e2e/infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REPO_DIR}/frontend/build:/site:ro
      - ${STATE_DIR:?}/certs/server.crt:/certs/server.crt:ro
      - ${STATE_DIR}/certs/server.key:/certs/server.key:ro
    # The test browser shares this network namespace for https://localhost:8443.
    # Fixture network allows the test runner to expire only its disposable account.
    networks: [upstream, fixtures]
    tmpfs: [/data, /config]
    depends_on: [backend]
  browser:
    image: ${BROWSER_IMAGE:?Built per run}
    network_mode: service:caddy
    environment:
      E2E_RUN_ID: ${RUN_ID}
      E2E_BASE_URL: https://localhost:8443
      E2E_EVIDENCE_DIR: /evidence
      E2E_CHROMIUM: /usr/bin/chromium
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
      TEST_DB_HOST: postgres
    volumes:
      - ${REPO_DIR}/e2e/node_modules:/work/e2e/node_modules:ro
      - ${REPO_DIR}/e2e/package.json:/work/e2e/package.json:ro
      - ${REPO_DIR}/e2e/playwright.config.ts:/work/e2e/playwright.config.ts:ro
      - ${REPO_DIR}/e2e/tsconfig.json:/work/e2e/tsconfig.json:ro
      - ${REPO_DIR}/e2e/tests:/work/e2e/tests:ro
      - ${REPO_DIR}/e2e/support:/work/e2e/support:ro
      - ${REPO_DIR}/e2e/scripts:/work/e2e/scripts:ro
      - ${STATE_DIR}/certs/ca.crt:/ca.crt:ro
      - ${STATE_DIR}/evidence:/evidence
    tmpfs: [/tmp]
    shm_size: 1gb
networks:
  upstream: {internal: true}
  database: {internal: true}
  fixtures: {internal: true}
